# Identity, contact, and integrations for the current site occupant.
# Forkers: run `npm run onboard` to replace these values with yours.

name: Gaurav Panchal
tagline: I build systems for better evolution.
title_suffix: The Coder
meta_description: The Quaternary Coder

# Profile image lives at this path; replace assets/img/profile.jpg with your own.
profile_image: /assets/img/profile.jpg

# Social links shown in the hero and contact sections.
# Comment out any you don't use.
social:
  - platform: linkedin
    url: http://www.linkedin.com/in/grvpanchal/
    icon_class: bg-linkedin_square
  - platform: facebook
    url: http://fb.me/grvpanchal
    icon_class: bg-facebook
  - platform: twitter
    url: http://twitter.com/grvpanchal
    icon_class: bg-twitter
  - platform: instagram
    url: http://instagram.com/grvpanchal
    icon_class: bg-instagram
  - platform: github
    url: http://github.com/grvpanchal
    icon_class: bg-github

# "Featured Blogs" section. blog-feed.js fetches featured_api_url: a JSON endpoint returning
# [{title, link, published, excerpt, featuredImage: {src, alt}, categories}] with CORS enabled
# (served by the n8n "Site - Featured Blogs API" workflow, which reads the Blogger feed).
# If it is blank or unreachable, the section shows assets/js/fallback-blogs.json.
blog:
  featured_api_url: https://workflows.grvpanchal.me/webhook/featured-blogs
  more_posts_url: https://blog.grvpanchal.me

# Contact form submits here. Replace with your own Lambda / form endpoint.
contact_form_action: https://ggll0gab25.execute-api.ap-south-1.amazonaws.com/dev/static-site-mailer

# Google Analytics (optional). Leave blank to disable.
google_analytics_id: G-2V6C46DMTQ
