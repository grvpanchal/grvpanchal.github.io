# ===========================================================================
# Main: profile (page 1)
# ===========================================================================
profile_html: >-
  As Tech Lead - UI at Encora Technologies, I lead frontend development
  initiatives with advanced proficiency in <strong>Web App Performance</strong>,
  <strong>NextJS</strong>, and <strong>PWA</strong>. My expertise includes
  architecting and deploying micro frontend solutions within cloud-based
  environments, enabling scalable and modular application design.

# ===========================================================================
# Main: skills overview bullets (page 1)
# ===========================================================================
skills_overview:
  - >-
    An accomplished <strong>Web Architect</strong>, specializing in
    <strong>JavaScript / TypeScript Based Technology</strong> like
    <strong>React</strong>. Extensive technical, analytical, and problem-solving
    skills.
  - >-
    Proficient in architecting and implementing <strong>micro frontend
    solutions</strong> using <strong>module federation</strong> for both
    <strong>client-side rendering (CSR)</strong> and <strong>server-side
    rendering (SSR)</strong> applications.
  - >-
    Led a high performing <strong>frontend development</strong> and
    <strong>leadership team</strong>, overseeing <strong>recruitment</strong>,
    <strong>onboarding</strong>, and <strong>continuous professional
    development</strong> and training to ensure technical excellence and
    cohesive team dynamics.
  - >-
    Have fortified a strong understanding of <strong>payment gateway
    integration</strong> for <strong>e-commerce websites</strong> over several
    years.
  - >-
    Fostered a collaborative, inclusive culture by introducing regular
    knowledge-sharing sessions, <strong>code reviews</strong>, and
    <strong>mentorship initiatives</strong>, resulting in improved code quality
    and increased team engagement.
  - >-
    Utilized <strong>agile methodologies</strong> to optimize project workflows,
    increase efficiency, and adapt to evolving project requirements.

